services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: darukaa-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  # -------------------------------------------------------------
  # 2. React + Vite Frontend (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: darukaa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        value: https://wzuhjoyvfgdatbmrrlii.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_rIHQKeOy_oBIDNUD8NaDoQ_t7rWNHWb
