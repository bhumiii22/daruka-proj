name: Darukaa.Earth CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: Backend Linting & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Geospatial Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Formatting (Black)
        run: |
          black --check --line-length 88 .

      - name: Run Python Linter (Flake8)
        run: |
          flake8 --config=.flake8 .

      - name: Execute Backend Unit Tests (Pytest)
        run: |
          pytest tests/ -v

  frontend-ci:
    name: Frontend Linting & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          npm install

      - name: Run ESLint
        run: |
          npm run lint

      - name: Verify Code Formatting (Prettier)
        run: |
          npx prettier --check "src/**/*.{js,jsx,css}"

      - name: Build Production Assets (Vite)
        run: |
          npm run build
